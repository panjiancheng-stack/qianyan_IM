spring:
  data:
    redis:
      database: 2
      host: localhost
      port: 59000
      password: e65K4t8w2
      timeout: 30000
  cloud:
    nacos:
      discovery:
        server-addr: localhost:18375
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 60000
            response-timeout: 60000
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:10010"
                allowedMethods:
                  - "GET"
                  - "POST"
                  - "PUT"
                  - "DELETE"
                  - "PATCH"
                  - "OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 36000
          routes:
            - id: UserService
              uri: lb://UserService
              predicates:
                - Path=/api/user/**,/api/contact/**,/api/group/**
            - id: OfflineDataService
              uri: lb://OfflineDataService
              predicates:
                - Path=/api/message/**
            - id: AiService
              uri: lb://AiService
              predicates:
                - Path=/api/ai/**
            - id: RedPacketService
              uri: lb://RedPacketService
              predicates:
                - Path=/api/chat/redPacket/**
